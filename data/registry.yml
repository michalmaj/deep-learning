# Dataset registry for this course.
#
# Every dataset used by a lecture or laboratory must be registered here
# before it is downloaded, cached, or committed. See data/README.md and
# COURSE_SPEC.md §24-27 for the policy this file implements.
#
# Schema per entry:
#
# - id: example-dataset               # stable slug, used in code/scripts
#   name: Example Dataset
#   source:
#     provider: Kaggle                # e.g. Kaggle, torchvision, Hugging Face, UCI
#     author: Example Author
#     url: https://example.org/dataset
#   license:
#     name: CC BY 4.0
#     url: https://creativecommons.org/licenses/by/4.0/
#   redistribution:
#     allowed: true                   # false/unclear -> do not commit the data
#     notes: "..."
#   citation:
#     text: "..."
#     bibtex: |
#       @dataset{...}
#   course_usage:
#     lectures: [5]
#     labs: [5]
#   files:
#     - path: data/example/train.csv
#       sha256: "..."
#
datasets:
  - id: fashion-mnist
    name: Fashion-MNIST
    source:
      provider: torchvision
      author: Han Xiao, Kashif Rasul, Roland Vollgraf (Zalando Research)
      url: https://github.com/zalandoresearch/fashion-mnist
    license:
      name: MIT License
      url: https://github.com/zalandoresearch/fashion-mnist/blob/master/LICENSE
    redistribution:
      allowed: true
      notes: >
        Not redistributed in this repository regardless of license terms:
        downloaded on demand via torchvision.datasets.FashionMNIST, which
        fetches from the project's own canonical mirror
        (fashion-mnist.s3-website.eu-central-1.amazonaws.com) and verifies
        each file's MD5 itself. No copy is ever committed to git.
    citation:
      text: >
        Xiao, H., Rasul, K., & Vollgraf, R. (2017). Fashion-MNIST: a Novel
        Image Dataset for Benchmarking Machine Learning Algorithms.
        arXiv:1708.07747.
      bibtex: |
        @article{xiao2017fashionmnist,
          author  = {Xiao, Han and Rasul, Kashif and Vollgraf, Roland},
          title   = {Fashion-MNIST: a Novel Image Dataset for Benchmarking Machine Learning Algorithms},
          journal = {arXiv preprint arXiv:1708.07747},
          year    = {2017}
        }
    course_usage:
      lectures: [6, 14, 15]
      labs: [12]
    # No `files:` list: this dataset is never stored at a repo-relative
    # path (see redistribution.notes), so scripts/verify_data.py has
    # nothing to check locally. Integrity is verified by torchvision
    # itself on every download, against these MD5s (its own values, not
    # ours): train-images 8d4fb7e6c68d591d4c3dfef9ec88bf0d,
    # train-labels 25c81989df183df01b3e8a0aad5dffbe,
    # t10k-images bef4ecab320f06d8554ea6380940ec79,
    # t10k-labels bb300cfdad3c16e7a12a480ee83cd310.

