name: Network tests

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-tests
  cancel-in-progress: false

env:
  DEEP_LEARNING_DATA_CACHE: ${{ github.workspace }}/data_cache
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch

jobs:
  validate-network-notebooks:
    name: Network notebooks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [fashion, vision, language]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore downloaded datasets and models
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DEEP_LEARNING_DATA_CACHE }}
            ${{ env.HF_HOME }}
            ${{ env.TORCH_HOME }}
          key: network-assets-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('uv.lock', 'data/registry.yml') }}
          restore-keys: |
            network-assets-${{ runner.os }}-${{ matrix.shard }}-
            network-assets-${{ runner.os }}-

      - name: Run network-dependent notebook shard
        run: uv run python scripts/run_network_test_shard.py ${{ matrix.shard }}
