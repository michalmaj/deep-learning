name: Network tests

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: network-tests
  cancel-in-progress: false

env:
  DEEP_LEARNING_DATA_CACHE: ${{ github.workspace }}/data_cache
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TORCH_HOME: ${{ github.workspace }}/.cache/torch

jobs:
  validate-network-notebooks:
    name: Network notebooks (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [fashion, vision, language]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore downloaded datasets and models
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.DEEP_LEARNING_DATA_CACHE }}
            ${{ env.HF_HOME }}
            ${{ env.TORCH_HOME }}
          key: network-assets-${{ runner.os }}-${{ matrix.shard }}-${{ hashFiles('uv.lock', 'data/registry.yml') }}
          restore-keys: |
            network-assets-${{ runner.os }}-${{ matrix.shard }}-
            network-assets-${{ runner.os }}-

      - name: Run network-dependent notebook shard
        run: uv run python scripts/run_network_test_shard.py ${{ matrix.shard }}
