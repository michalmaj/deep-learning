[project]
name = "deep-learning"
version = "1.0.0"
description = "Deep Learning course repository: lectures, laboratories, and executable experiments for Inzynieria i zarzadzanie sztuczna inteligencja."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143.5",
    "httpx>=0.28.1",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.20.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
markers = [
    "network: tests that download external datasets or model weights",
]
